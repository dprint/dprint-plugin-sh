[package]
name = "dprint-plugin-shuck"
version = "0.2.2"
authors = ["Kenichi Kamiya <kachick1@gmail.com>"]
edition = "2024"
homepage = "https://github.com/dprint/dprint-plugin-shuck"
keywords = ["formatting", "formatter", "shell", "bash", "zsh"]
license = "MIT"
publish = false
repository = "https://github.com/dprint/dprint-plugin-shuck"
description = "Shell script formatter for dprint via shuck-formatter."

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
opt-level = 3
debug = false
lto = true
debug-assertions = false
overflow-checks = false
panic = "abort"

[features]
wasm = ["serde_json", "dprint-core/wasm"]

[dependencies]
dprint-core = { version = "0.71.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", optional = true }
shuck-formatter = "0.2.7"
thiserror = "2"

[dev-dependencies]
dprint-development = "0.12.1"
serde_json = "1.0.154"
